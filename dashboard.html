<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kasir - Kintoun Cafe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#11263d',      // Sesuai revisi terbaru
                        ivory: '#EEEBE1', 
                        taupe: '#938370',        // Sesuai revisi terbaru
                        secondary: '#3C586D', 
                        coolGrey: '#C0C9CE', 
                        muted: '#B8AD98', 
                        lightBeige: '#D6CFBF'
                    },
                    fontFamily: { 
                        sans: ['Poppins', 'sans-serif'],
                        comfortaa: ['Comfortaa', 'cursive']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-ivory text-primary font-sans min-h-screen flex flex-col">

    <!-- =========================================
         1. LAYAR LOGIN / PILIH STORE
    ========================================== -->
    <div id="loginScreen" class="fixed inset-0 z-50 bg-ivory flex items-center justify-center p-5 transition-opacity duration-500">
        <div class="bg-primary rounded-[28px] shadow-2xl w-full max-w-sm p-8 text-center border border-secondary/30 relative overflow-hidden">

            <div class="relative z-10">
                <h2 class="font-poppins font-black text-2xl text-ivory tracking-wider uppercase mb">KINTOUN</h2>
                <p class="font-poppins font-regular text-sm text-ivory/80 mb-10 tracking-wide">Bulk Order System</p>

                <div class="text-left mb-6">
                    <label class="block text-xs font-semibold text-ivory/70 mb-2 ml-1"></label>
                    <div class="relative">
                        <select id="storeSelector" class="w-full bg-secondary/30 border-2 border-secondary/50 text-ivory text-sm font-medium rounded-xl py-3.5 px-4 outline-none focus:border-lightBeige appearance-none cursor-pointer transition">
                            <option value="" disabled selected hidden>Pilih Lokasi Store...</option>
                            <option value="MALANG - GALUNGGUNG" class="text-primary bg-white">Malang - Galunggung</option>
                            <option value="KEDIRI - ERLANGGA" class="text-primary bg-white">Kediri - Erlangga</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-ivory/70">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <button onclick="enterDashboard()" class="w-full bg-ivory text-primary font-bold py-3.5 rounded-xl hover:bg-lightBeige transition shadow-lg outline-none">
                    Masuk Dashboard
                </button>
            </div>
        </div>
    </div>

    <!-- =========================================
         2. LAYAR DASHBOARD UTAMA
    ========================================== -->
    <div id="mainDashboard" class="hidden flex-col min-h-screen">
        
        <!-- Header Mepet Atas (Tanpa margin, tanpa rounded) -->
        <header class="bg-primary text-ivory px-4 py-3.5 shadow-md flex justify-between items-center sticky top-0 z-20 w-full">
            <div class="flex items-center space-x-3 md:space-x-4">
                <!-- Tombol Back Kiri Atas -->
                <button onclick="exitDashboard()" class="p-2 bg-secondary/40 hover:bg-secondary rounded-lg transition flex items-center justify-center text-ivory shadow-sm outline-none" title="Kembali ke Login Store">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div>
                    <!-- Judul Dinamis -->
                    <h1 id="dashboardTitle" class="text-base md:text-lg font-bold tracking-tight leading-tight uppercase">POS - KINTOUN</h1>
                    <p class="text-ivory/70 text-[10px] md:text-xs font-medium tracking-wide mt-0.5">Bulk Order System Dashboard</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2.5 md:space-x-4">
                <span id="statusConnection" class="text-[10px] md:text-xs font-bold tracking-wider uppercase bg-green-500 text-white px-2.5 md:px-3 py-1 md:py-1.5 rounded-full shadow-sm">Online</span>
                <button onclick="fetchOrders()" class="bg-secondary/50 hover:bg-taupe text-ivory px-3 md:px-4 py-1.5 md:py-2 rounded-lg text-[11px] md:text-xs font-bold transition shadow-sm outline-none">
                    Refresh
                </button>
            </div>
        </header>

        <main class="flex-grow px-4 md:px-8 pt-6 pb-10">
            <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <!-- Data Pesanan Muncul Di Sini -->
            </div>
        </main>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" class="fixed inset-0 bg-primary bg-opacity-80 backdrop-blur-sm hidden flex-col justify-center items-center z-[60]">
        <div class="w-12 h-12 border-4 border-ivory border-t-taupe rounded-full animate-spin mb-4"></div>
        <p class="font-bold text-ivory tracking-wide">Memperbarui Status...</p>
    </div>

    <!-- KONFIRMASI STATUS MODAL -->
    <div id="customConfirmModal" class="fixed inset-0 bg-primary bg-opacity-70 backdrop-blur-sm hidden flex-col justify-center items-center z-[70] px-4 transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl border border-lightBeige w-full max-w-sm overflow-hidden transform transition-all">
            <div class="p-6">
                <div class="flex items-center space-x-3 mb-4">
                    <div class="bg-secondary bg-opacity-10 p-2 rounded-full text-secondary">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h3 class="text-lg font-bold text-primary">Konfirmasi Status</h3>
                </div>
                <p id="confirmMessage" class="text-secondary text-sm font-medium leading-relaxed"></p>
            </div>
            <div class="bg-ivory px-6 py-4 flex justify-end space-x-3 border-t border-lightBeige">
                <button onclick="closeConfirmModal()" class="px-4 py-2 rounded-xl text-sm font-bold text-taupe hover:bg-lightBeige transition outline-none">Batal</button>
                <button id="btnConfirmAction" class="px-4 py-2 rounded-xl text-sm font-bold bg-primary text-ivory hover:bg-secondary transition shadow-md outline-none">Ya, Ubah Status</button>
            </div>
        </div>
    </div>

<script>
    // URL Webhook sesuai script kamu sebelumnya
    const N8N_GET_ORDERS_URL = 'https://n8n-h238.srv1866922.hstgr.cloud/webhook-test/get-orders-dev'; 
    const N8N_UPDATE_STATUS_URL = 'https://n8n-h238.srv1866922.hstgr.cloud/webhook-test/pesanan-diproses-kak-dev';

    let pendingAction = null;
    let currentStoreFilter = ''; 
    let fetchInterval = null;

    // FUNGSI MASUK DASHBOARD (DARI LAYAR LOGIN)
    function enterDashboard() {
        const selector = document.getElementById('storeSelector');
        if (!selector.value) {
            alert('Silakan pilih lokasi outlet terlebih dahulu!');
            return;
        }

        currentStoreFilter = selector.value;
        
        // Ubah Judul Header Dinamis
        document.getElementById('dashboardTitle').innerText = `POS ${currentStoreFilter}`;

        // Transisi Layar
        document.getElementById('loginScreen').classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('mainDashboard').classList.add('flex');
            
            // Mulai Tarik Data
            fetchOrders();
            fetchInterval = setInterval(fetchOrders, 10000); 
        }, 300);
    }

    // FUNGSI KELUAR DASHBOARD (TOMBOL BACK)
    function exitDashboard() {
        clearInterval(fetchInterval);
        currentStoreFilter = '';
        document.getElementById('storeSelector').value = '';
        
        // Kosongkan Container agar tidak bocor
        document.getElementById('ordersContainer').innerHTML = '';

        // Transisi Layar Kembali
        document.getElementById('mainDashboard').classList.add('hidden');
        document.getElementById('mainDashboard').classList.remove('flex');
        
        const loginScreen = document.getElementById('loginScreen');
        loginScreen.classList.remove('hidden');
        setTimeout(() => {
            loginScreen.classList.remove('opacity-0', 'pointer-events-none');
        }, 50);
    }

    // FUNGSI TARIK DATA PESANAN
    async function fetchOrders() {
        if (!currentStoreFilter) return;

        const statusBadge = document.getElementById('statusConnection');
        statusBadge.innerText = 'Syncing...';
        statusBadge.className = 'text-[10px] md:text-xs font-bold tracking-wider uppercase bg-taupe text-white px-2.5 md:px-3 py-1 md:py-1.5 rounded-full shadow-sm';

        try {
            const response = await fetch(N8N_GET_ORDERS_URL + '?t=' + new Date().getTime(), { 
                headers: { 'Accept': 'application/json' }
            });
            const rawData = await response.json();

            const orders = rawData.map(item => ({
                id: item['ID Pesanan'],
                timestamp: item['Waktu'],
                name: item['Nama'],
                wa: item['No WA'],
                address: item['Alamat'],
                orders: item['Detail Pesanan'],
                total: parseInt(item['Total'] || 0),
                payment: item['Pembayaran'],
                store: item['Lokasi Store'] || item['Store'] || 'MALANG - GALUNGGUNG',
                status: item['Status']
            }));

            // Filter ketat berdasarkan Store yang dipilih saat login
            const filteredOrders = orders.filter(o => {
                return (o.store || '').toUpperCase() === currentStoreFilter.toUpperCase();
            });

            const reversedOrders = filteredOrders.reverse();
            renderOrders(reversedOrders);

            statusBadge.innerText = 'Online';
            statusBadge.className = 'text-[10px] md:text-xs font-bold tracking-wider uppercase bg-secondary text-white px-2.5 md:px-3 py-1 md:py-1.5 rounded-full shadow-sm';
        } catch (error) {
            statusBadge.innerText = 'Offline';
            statusBadge.className = 'text-[10px] md:text-xs font-bold tracking-wider uppercase bg-red-800 text-white px-2.5 md:px-3 py-1 md:py-1.5 rounded-full shadow-sm';
        }
    }

    // FUNGSI RENDER TAMPILAN PESANAN
    function renderOrders(orders) {
        const container = document.getElementById('ordersContainer');
        let activeOrdersCount = 0;
        let html = '';

        orders.forEach(order => {
            if(order.status === 'Selesai') return; 
            activeOrdersCount++;

            const orderListHtml = order.orders ? order.orders.replace(/\n/g, '<br>') : '';
            let statusUI = order.status === 'Pesanan Masuk' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-ivory text-secondary border-lightBeige';
            let cardAccent = order.status === 'Pesanan Masuk' ? 'border-t-4 border-t-red-400' : 'border-t-4 border-t-secondary';
            
            const safeId = order.id ? order.id.replace(/'/g, "\\'") : '';
            const safeWa = order.wa ? String(order.wa).replace(/'/g, "\\'") : '';
            const safeName = order.name ? order.name.replace(/'/g, "\\'") : '';

            html += `
            <div class="bg-white rounded-2xl shadow-sm border border-lightBeige flex flex-col ${cardAccent} overflow-hidden transition hover:shadow-md">
                <div class="p-4 md:p-5 border-b border-lightBeige flex justify-between items-start">
                    <div>
                        <span class="font-extrabold text-xs text-taupe tracking-wider">${order.id || '-'}</span>
                        <p class="text-xs text-coolGrey font-medium mt-1">${order.timestamp || '-'}</p>
                    </div>
                    <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider border ${statusUI}">${order.status || '-'}</span>
                </div>

                <div class="p-4 md:p-5 flex-grow">
                    <h3 class="font-bold text-xl text-primary mb-1">${order.name || '-'}</h3>
                    <p class="text-secondary text-sm font-medium mb-4 flex items-center">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        ${order.wa || '-'}
                    </p>
                    <div class="bg-ivory p-3 rounded-xl border border-lightBeige mb-4">
                        <p class="font-bold text-[10px] text-taupe uppercase tracking-wider mb-1">Metode Pemesanan</p>
                        <p class="text-primary text-sm font-medium leading-relaxed">${order.address || '-'}</p>
                    </div>
                    <div class="mb-4">
                        <p class="font-bold text-[10px] text-taupe uppercase tracking-wider mb-2">Detail Pesanan</p>
                        <p class="text-primary text-sm font-semibold leading-relaxed pl-2 border-l-2 border-secondary">${orderListHtml}</p>
                    </div>
                    <div class="pt-2 border-t border-lightBeige/50 flex justify-between items-center text-xs">
                        <span class="text-secondary font-medium">Total (${order.payment || 'QRIS'})</span>
                        <span class="font-black text-sm text-primary">Rp ${(order.total || 0).toLocaleString('id-ID')}</span>
                    </div>
                </div>

                <div class="p-4 md:p-5 bg-white border-t border-lightBeige space-y-3">
                    ${order.status === 'Pesanan Masuk' ? `<button onclick="updateStatus('${safeId}', 'Sedang Diproses', '${safeWa}', '${safeName}')" class="w-full bg-primary text-ivory py-3 rounded-xl text-sm font-bold hover:bg-secondary transition shadow-md outline-none">Proses Pesanan</button>` : ''}
                    ${order.status === 'Sedang Diproses' ? `<button onclick="updateStatus('${safeId}', 'Selesai', '${safeWa}', '${safeName}')" class="w-full bg-secondary text-ivory py-3 rounded-xl text-sm font-bold hover:bg-primary transition shadow-md outline-none">Tandai Selesai & Kirim</button>` : ''}
                </div>
            </div>`;
        });

        if(activeOrdersCount === 0) {
            container.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-20"><p class="text-secondary font-medium">Belum ada pesanan aktif.</p></div>`;
        } else {
            container.innerHTML = html;
        }
    }

    function closeConfirmModal() {
        document.getElementById('customConfirmModal').classList.add('hidden');
        document.getElementById('customConfirmModal').classList.remove('flex');
        pendingAction = null;
    }

    function updateStatus(orderId, newStatus, customerWA, customerName) {
        const modal = document.getElementById('customConfirmModal');
        const message = document.getElementById('confirmMessage');
        message.innerHTML = `Ubah status pesanan <span class="font-bold text-primary">${orderId}</span> menjadi <span class="font-bold text-primary">"${newStatus}"</span>?`;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        pendingAction = { orderId, newStatus, customerWA, customerName };
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('btnConfirmAction').addEventListener('click', function() {
            if(pendingAction) {
                executeStatusUpdate(pendingAction.orderId, pendingAction.newStatus, pendingAction.customerWA, pendingAction.customerName);
            }
            closeConfirmModal();
        });
    });

    async function executeStatusUpdate(orderId, newStatus, customerWA, customerName) {
        document.getElementById('loadingOverlay').classList.remove('hidden');
        document.getElementById('loadingOverlay').classList.add('flex');

        try {
            let formattedWA = String(customerWA).trim();
            if (formattedWA.startsWith('0')) formattedWA = '62' + formattedWA.substring(1);
            else if (!formattedWA.startsWith('62')) formattedWA = '62' + formattedWA;

            const n8nPayload = { 
                orderId: String(orderId), 
                status: String(newStatus), 
                nomor_wa: formattedWA, 
                nama: String(customerName)
            };

            const response = await fetch(N8N_UPDATE_STATUS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(n8nPayload)
            });

            if (response.ok) {
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('loadingOverlay').classList.remove('flex');
                fetchOrders(); 
            } else {
                throw new Error("Status API: " + response.status);
            }
        } catch (error) {
            alert('Gagal update status ke n8n.');
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('loadingOverlay').classList.remove('flex');
        }
    }
</script>
</body>
</html>
